<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true" role="img">
  <defs>
    <linearGradient id="qbrainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="128" cy="128" r="120" fill="url(#qbrainGradient)" opacity="0.1"/>
  
  <!-- Q Letter Shape -->
  <path d="M 128 40 L 180 60 L 200 100 L 180 140 L 128 160 L 76 140 L 56 100 L 76 60 Z" 
        fill="url(#qbrainGradient)" 
        stroke="url(#qbrainGradient)" 
        stroke-width="2"/>
  
  <!-- Brain/Neural Network Icon -->
  <g transform="translate(128, 128)">
    <!-- Neural nodes -->
    <circle cx="-30" cy="-20" r="8" fill="url(#brainGradient)"/>
    <circle cx="30" cy="-20" r="8" fill="url(#brainGradient)"/>
    <circle cx="-30" cy="20" r="8" fill="url(#brainGradient)"/>
    <circle cx="30" cy="20" r="8" fill="url(#brainGradient)"/>
    <circle cx="0" cy="0" r="12" fill="url(#brainGradient)"/>
    
    <!-- Neural connections -->
    <line x1="-30" y1="-20" x2="0" y2="0" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="30" y1="-20" x2="0" y2="0" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="-30" y1="20" x2="0" y2="0" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="30" y1="20" x2="0" y2="0" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="url(#brainGradient)" stroke-width="1" opacity="0.4"/>
    <line x1="-30" y1="20" x2="30" y2="20" stroke="url(#brainGradient)" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Q Tail -->
  <path d="M 140 140 Q 160 150 170 170" 
        fill="none" 
        stroke="url(#qbrainGradient)" 
        stroke-width="4" 
        stroke-linecap="round"/>
</svg>